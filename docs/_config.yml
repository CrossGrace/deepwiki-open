title: DeepWiki Open Documentation
description: Enterprise GitHub Wiki Generator with AI-Powered Documentation
theme: jekyll-theme-cayman
baseurl: "/deepwiki-open"
url: "https://crossgrace.github.io"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: true

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - yarn.lock
